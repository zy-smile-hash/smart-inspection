<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>场景配置</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      color: #1a1a1a;
    }
    .page-container {
      width: 402px;
      min-height: 874px;
      background: #f4f6f9;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      padding-top: 48px;
      background: #f4f6f9;
      position: relative;
    }
    .top-bar .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 600;
      color: #333;
      text-decoration: none;
    }
    .top-bar .page-title {
      font-size: 17px;
      font-weight: 600;
      color: #000;
    }
    .top-bar .right-icons-placeholder {
      width: 60px;
    }
    
    .subtitle {
      padding: 4px 16px 14px;
      font-size: 13px;
      color: #888;
      background: #f4f6f9;
    }
    
    .scene-list {
      padding: 0 12px;
      padding-bottom: 120px;
    }
    .scene-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px 14px 12px;
      margin-bottom: 12px;
      border: 2px solid transparent;
      transition: all 0.25s ease;
      position: relative;
    }
    .scene-card.active {
      border-color: #6b9bff;
      background: #f0f4ff;
    }
    .scene-card.active::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(107,155,255,0.08) 0%, rgba(107,155,255,0) 100%);
      pointer-events: none;
    }
    
    .scene-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .scene-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      position: relative;
    }
    .scene-icon.generic { background: linear-gradient(135deg, #c5d5ff 0%, #a8beff 100%); }
    .scene-icon.community { background: linear-gradient(135deg, #a8d5ff 0%, #6bb3ff 100%); }
    .scene-icon.water { background: linear-gradient(135deg, #a5e0ff 0%, #5ac1f5 100%); }
    .scene-icon.shop { background: linear-gradient(135deg, #ffd8a8 0%, #ffb566 100%); }
    
    .scene-info {
      flex: 1;
      min-width: 0;
    }
    .scene-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scene-name {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .new-tag {
      background: linear-gradient(135deg, #ffb84d 0%, #ff8a00 100%);
      color: #fff;
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 8px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      line-height: 1.4;
    }
    .new-tag .sparkle { font-size: 9px; }
    
    .scene-sub {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
      display: none;
    }
    .scene-card.active .scene-sub {
      display: block;
    }
    
    .scene-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s;
    }
    .scene-card.active .scene-check {
      background: #1a73e8;
      border-color: #1a73e8;
    }
    .scene-check svg { display: none; }
    .scene-card.active .scene-check svg { display: block; }
    
    .scene-tags {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #d5def0;
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .scene-card.active .scene-tags {
      display: flex;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 16px;
      background: #fff;
      font-size: 12px;
      color: #2a7d4f;
      border: 1px solid #b8e6cc;
    }
    .tag-chip.purple {
      background: #faf0ff;
      color: #7a3dbf;
      border-color: #d6b8f5;
    }
    .tag-chip.purple .tag-dot {
      background: #e8d4fb;
      color: #7a3dbf;
    }
    .tag-add.hidden { display: none; }
    .tag-chip .tag-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #d4f0e2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #2a7d4f;
    }
    .tag-add {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 16px;
      background: #fff;
      font-size: 12px;
      color: #999;
      border: 1px dashed #ccc;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tag-add:hover {
      color: #1a73e8;
      border-color: #1a73e8;
    }
    
    .scene-setting {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #bbb;
      font-size: 20px;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.2s;
      margin-left: 8px;
    }
    .scene-setting:hover {
      color: #1a73e8;
      background: rgba(26,115,232,0.08);
    }
    
    .confirm-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(402px - 40px);
      max-width: calc(100% - 40px);
    }
    .confirm-btn {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #4a8cff 0%, #1a73e8 100%);
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(26,115,232,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .confirm-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 10px rgba(26,115,232,0.3);
    }
    
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(0,0,0,0.78);
      color: #fff;
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s;
      z-index: 9999;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    
    .tag-picker-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s;
      z-index: 9998;
    }
    .tag-picker-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .tag-picker {
      width: 100%;
      max-width: 402px;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 18px 16px 24px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tag-picker-overlay.show .tag-picker {
      transform: translateY(0);
    }
    .tag-picker-title {
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
    }
    .tag-picker-input {
      width: 100%;
      height: 42px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .tag-picker-input:focus {
      border-color: #1a73e8;
    }
    .tag-picker-hint {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }
    .tag-picker-btns {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .tag-picker-btn {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }
    .tag-picker-btn.cancel {
      background: #f0f0f0;
      color: #666;
    }
    .tag-picker-btn.confirm {
      background: #1a73e8;
      color: #fff;
    }
    .tag-picker-btn.confirm:disabled {
      background: #b0c9ee;
      color: #fff;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="top-bar">
      <a class="back-btn" href="index.html">‹</a>
      <div class="page-title">场景配置</div>
      <div class="right-icons-placeholder"></div>
    </div>
    
    <div class="subtitle">根据摄像头所在场景，进行选择</div>
    
    <div class="scene-list">
      <div class="scene-card active" data-scene="generic">
        <div class="scene-header">
          <div class="scene-icon generic">🎯</div>
          <div class="scene-info">
            <div class="scene-name-row">
              <span class="scene-name">通用场景</span>
              <span class="new-tag"><span class="sparkle">✨</span>大模型</span>
            </div>
            <div class="scene-sub">当前场景，支持检测以下目标</div>
          </div>
          <div class="scene-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></svg>
          </div>
        </div>
        <div class="scene-tags">
          <span class="tag-chip"><span class="tag-dot">✓</span>人形</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>滑倒</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>损坏商品</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>争吵</span>
          <span class="tag-add" id="addCustomTag">＋ 自定义设置</span>
        </div>
      </div>
      
      <div class="scene-card" data-scene="community">
        <div class="scene-header">
          <div class="scene-icon community">🏘️</div>
          <div class="scene-info">
            <div class="scene-name-row">
              <span class="scene-name">巡社区</span>
              <span class="new-tag"><span class="sparkle">✨</span>大模型</span>
            </div>
            <div class="scene-sub">当前场景，支持检测以下目标</div>
          </div>
          <div class="scene-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></svg>
          </div>
        </div>
        <div class="scene-tags">
          <span class="tag-chip"><span class="tag-dot">✓</span>火焰</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>烟雾</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>吸烟的人</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>垃圾</span>
          <span class="tag-add" id="addCustomTagCommunity">＋ 自定义设置</span>
        </div>
      </div>
      
      <div class="scene-card" data-scene="water">
        <div class="scene-header">
          <div class="scene-icon water">💧</div>
          <div class="scene-info">
            <div class="scene-name-row">
              <span class="scene-name">巡水域</span>
              <span class="new-tag"><span class="sparkle">✨</span>大模型</span>
            </div>
            <div class="scene-sub">当前场景，支持检测以下目标</div>
          </div>
          <div class="scene-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></svg>
          </div>
        </div>
        <div class="scene-tags">
          <span class="tag-chip"><span class="tag-dot">✓</span>人形</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>动物</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>漂浮物</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>垃圾</span>
          <span class="tag-add" id="addCustomTagWater">＋ 自定义设置</span>
        </div>
      </div>
      
      <div class="scene-card" data-scene="shop">
        <div class="scene-header">
          <div class="scene-icon shop">🏪</div>
          <div class="scene-info">
            <div class="scene-name-row">
              <span class="scene-name">巡店铺</span>
              <span class="new-tag"><span class="sparkle">✨</span>大模型</span>
            </div>
            <div class="scene-sub">当前场景，支持检测以下目标</div>
          </div>
          <div class="scene-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></svg>
          </div>
        </div>
        <div class="scene-tags">
          <span class="tag-chip"><span class="tag-dot">✓</span>烟雾</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>垃圾</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>玩手机的人</span>
          <span class="tag-chip"><span class="tag-dot">✓</span>吸烟的人</span>
          <span class="tag-add" id="addCustomTagShop">＋ 自定义设置</span>
        </div>
      </div>
      
    </div>
    
    <div class="confirm-bar">
      <button class="confirm-btn" id="confirmBtn">确定</button>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <div class="tag-picker-overlay" id="tagPicker">
      <div class="tag-picker">
        <div class="tag-picker-title">添加自定义检测目标</div>
        <input type="text" class="tag-picker-input" id="tagInput" placeholder="请输入目标名称，如：耳机、热水壶、消防栓">
        <div class="tag-picker-hint">字数控制在5个以内</div>
        <div class="tag-picker-btns">
          <button class="tag-picker-btn cancel" id="tagPickerCancel">取消</button>
          <button class="tag-picker-btn confirm" id="tagPickerConfirm" disabled>确定</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }
    
    // 场景切换
    document.querySelectorAll('.scene-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (card.querySelector('.tag-picker-overlay') || e.target.closest('.scene-tags') || e.target.closest('.scene-check')) {
          if (e.target.closest('.scene-tags') && !e.target.closest('.tag-add')) return;
        }
        document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        const name = card.querySelector('.scene-name').textContent;
        showToast('已选择「' + name + '」');
      });
    });
    
    // 设置按钮
    document.querySelectorAll('.scene-setting').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const name = btn.parentElement.querySelector('.scene-name').textContent;
        showToast('「' + name + '」设置');
      });
    });
    
    // 添加自定义标签
    const tagOverlay = document.getElementById('tagPicker');
    const tagInput = document.getElementById('tagInput');
    const tagConfirm = document.getElementById('tagPickerConfirm');
    
    function openTagPicker(e) {
      e.stopPropagation();
      tagInput.value = '';
      tagConfirm.disabled = true;
      tagOverlay.classList.add('show');
      setTimeout(() => tagInput.focus(), 200);
    }
    
    document.getElementById('addCustomTag').addEventListener('click', openTagPicker);
    document.getElementById('addCustomTagCommunity').addEventListener('click', openTagPicker);
    document.getElementById('addCustomTagWater').addEventListener('click', openTagPicker);
    document.getElementById('addCustomTagShop').addEventListener('click', openTagPicker);
    document.getElementById('tagPickerCancel').addEventListener('click', () => {
      tagOverlay.classList.remove('show');
    });
    tagOverlay.addEventListener('click', (e) => {
      if (e.target === tagOverlay) tagOverlay.classList.remove('show');
    });
    tagInput.addEventListener('input', () => {
      const len = tagInput.value.trim().length;
      tagConfirm.disabled = !(len > 0 && len <= 5);
    });
    document.getElementById('tagPickerConfirm').addEventListener('click', () => {
      const val = tagInput.value.trim();
      if (!val) return;
      const activeCard = document.querySelector('.scene-card.active .scene-tags');
      if (activeCard) {
        const addBtn = activeCard.querySelector('.tag-add');
        const chip = document.createElement('span');
        chip.className = 'tag-chip purple';
        chip.innerHTML = '<span class="tag-dot">✓</span>' + val + ' <span style="cursor:pointer;color:#e74c3c;font-size:12px;margin-left:2px;" data-remove>×</span>';
        chip.querySelector('[data-remove]').addEventListener('click', (e) => {
          e.stopPropagation();
          chip.remove();
          addBtn.classList.remove('hidden');
        });
        activeCard.insertBefore(chip, addBtn);
        addBtn.classList.add('hidden');
      }
      tagOverlay.classList.remove('show');
      showToast('已添加「' + val + '」');
    });
    
    // 确定
    document.getElementById('confirmBtn').addEventListener('click', () => {
      const name = document.querySelector('.scene-card.active .scene-name').textContent;
      showToast('已保存「' + name + '」配置');
      setTimeout(() => {
        if (window.history.length > 1) window.history.back();
        else window.location.href = 'index.html';
      }, 800);
    });
    
    // 返回按钮
    document.querySelector('.back-btn').addEventListener('click', (e) => {
      e.preventDefault();
      if (window.history.length > 1) window.history.back();
      else window.location.href = 'index.html';
    });
  </script>
</body>
</html>
