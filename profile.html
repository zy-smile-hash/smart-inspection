<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人中心</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
    }
    
    .page-container {
      width: 402px;
      height: 874px;
      background: #f5f5f5;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }
    
    .page-content {
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }
    
    .top-bar {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      padding-top: 48px;
      background: #1a73e8;
    }
    
    .back-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
    }
    
    .page-title {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
    }
    
    .user-card {
      background: #1a73e8;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .user-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .user-avatar svg {
      width: 100%;
      height: 100%;
    }
    
    .user-info {
      flex: 1;
      color: #fff;
    }
    
    .user-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .user-id {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 4px;
    }
    
    .user-phone {
      font-size: 12px;
      opacity: 0.6;
    }
    
    .menu-list {
      background: #fff;
      margin: 12px;
      border-radius: 12px;
      overflow: hidden;
    }
    
    .menu-item {
      display: flex;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .menu-item:last-child {
      border-bottom: none;
    }
    
    .menu-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 12px;
    }
    
    .menu-icon.yellow {
      background: #fff3e0;
      color: #e65100;
    }
    
    .menu-icon.green {
      background: #e8f5e9;
      color: #2e7d32;
    }
    
    .menu-icon.red {
      background: #ffebee;
      color: #c62828;
    }
    
    .menu-icon.blue {
      background: #e3f2fd;
      color: #1565c0;
    }
    
    .menu-icon.gray {
      background: #f5f5f5;
      color: #616161;
    }
    
    .menu-icon.notification {
      background: #fff8e1;
      color: #ff9800;
    }
    
    .menu-icon.privacy {
      background: #f3e5f5;
      color: #7b1fa2;
    }
    
    .menu-text {
      flex: 1;
      font-size: 15px;
      color: #333;
    }
    
    .menu-arrow {
      font-size: 16px;
      color: #ccc;
    }
    
    .menu-group {
      margin-top: 12px;
    }
    
    .menu-group-title {
      padding: 0 16px;
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
    }
    
    .logout-btn {
      margin: 24px 12px;
      padding: 14px;
      background: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      color: #e53935;
      width: calc(100% - 24px);
    }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-content">
      <div class="top-bar">
        <a class="back-btn" href="index.html">‹</a>
        <div class="page-title">个人中心</div>
        <div style="width: 32px;"></div>
      </div>
      
      <div class="user-card">
        <div class="user-avatar">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#f5f5f5"/>
            <circle cx="50" cy="38" r="18" fill="#ddd"/>
            <ellipse cx="50" cy="75" rx="22" ry="18" fill="#ddd"/>
          </svg>
        </div>
        <div class="user-info">
          <div class="user-name">智能巡检用户</div>
          <div class="user-id">微信号：wx_xxxx1234</div>
          <div class="user-phone">绑定手机：138****8888</div>
        </div>
      </div>
      
      <div class="menu-group">
        <div class="menu-group-title">服务支持</div>
        <div class="menu-list">
          <div class="menu-item">
            <div class="menu-icon yellow">❓</div>
            <div class="menu-text">帮助中心</div>
            <div class="menu-arrow">›</div>
          </div>
          <div class="menu-item">
            <div class="menu-icon green">💬</div>
            <div class="menu-text">意见反馈</div>
            <div class="menu-arrow">›</div>
          </div>
          <div class="menu-item">
            <div class="menu-icon red">💌</div>
            <div class="menu-text">在线客服</div>
            <div class="menu-arrow">›</div>
          </div>
          <div class="menu-item">
            <div class="menu-icon blue">ℹ️</div>
            <div class="menu-text">关于我们</div>
            <div class="menu-arrow">›</div>
          </div>
        </div>
      </div>
      
      <div class="menu-group">
        <div class="menu-group-title">设置</div>
        <div class="menu-list">
          <div class="menu-item">
            <div class="menu-icon gray">👤</div>
            <div class="menu-text">账号与安全</div>
            <div class="menu-arrow">›</div>
          </div>
          <div class="menu-item">
            <div class="menu-icon notification">🔔</div>
            <div class="menu-text">通知设置</div>
            <div class="menu-arrow">›</div>
          </div>
          <div class="menu-item">
            <div class="menu-icon privacy">🔒</div>
            <div class="menu-text">隐私设置</div>
            <div class="menu-arrow">›</div>
          </div>
        </div>
      </div>
      
      <button class="logout-btn">退出登录</button>
    </div>
  </div>
</body>
</html>
